name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # soufiane.app palette: cream snake on dark, ink snake on light, red cells
          outputs: |
            dist/snake-dark.svg?color_snake=#f4f1ec&color_dots=#161b22,#4a1d16,#7d2b1f,#b73b2b,#ec4e39
            dist/snake-light.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#f8d3cc,#f2a597,#e9705d,#e0432f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
